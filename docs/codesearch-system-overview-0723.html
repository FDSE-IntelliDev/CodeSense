  text-decoration-style: dashed;

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;

  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

  z-index: 50;

  left: 0;
  width: max-content;

    calc(100vw - 10px)
  );

    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

.sr-only {

  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {
  display: flex;
  flex-wrap: wrap;

.btn {

  display: inline-flex;

  min-height: 28px;
  align-items: center;

  border-radius: var(--radius-lg);

  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;

  white-space: nowrap;
  user-select: none;

.btn:is(.btn-block, .viz-tile) {

.btn:not(:disabled):hover {

  height: 14px;

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;codesearch-system-overview&quot;&gt;
  &lt;style&gt;

  &lt;section class=&quot;overview-strip&quot; aria-label=&quot;系统定位&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;

      &lt;div class=&quot;text-small&quot;&gt;关键词、行为、结构约束混合表达&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;项目知识&lt;/div&gt;

      &lt;div class=&quot;text-small&quot;&gt;索引、关系数据库与 Hybrid Embedding&lt;/div&gt;
    &lt;/div&gt;

      &lt;div class=&quot;text-muted&quot;&gt;输出&lt;/div&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;problem-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;problem-heading&quot;&gt;要解决的三个核心问题&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;problem-map&quot;&gt;
      &lt;div class=&quot;problem lexical&quot;&gt;
        &lt;strong&gt;命名不一致&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;查询写 login，代码可能写 auth、signIn 或缩写。通过 ngram、缩写索引和项目术语相关性提高召回。&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;problem graph&quot;&gt;
        &lt;strong&gt;语义分散在协作代码中&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;一个业务意图可能由 caller、service、repository 等多个节点共同完成。通过调用图与 AND(n) 表达局部协作。&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;problem semantic&quot;&gt;
        &lt;strong&gt;字面命中不等于功能相关&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;候选名称相似但职责可能不同。通过代码聚类、项目 Term Embedding 和 LLM Judge 做高精度判断。&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;planner-example-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;planner-example-heading&quot;&gt;Planner 示例：从 SemCon 到可执行搜索逻辑&lt;/h2&gt;
      &lt;span class=&quot;viz-badge text-small&quot;&gt;实际 login/user condition + 明确标注的扩展&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;raw-query-example&quot; aria-label=&quot;Planner 示例的原始自然语言查询&quot;&gt;
      &lt;strong&gt;Raw Query&lt;/strong&gt;
      &lt;code&gt;raw_query: &quot;Find the user login entry point&quot;&lt;/code&gt;
    &lt;/div&gt;
    &lt;div class=&quot;planner-example-grid&quot;&gt;
      &lt;div class=&quot;example-step&quot;&gt;
        &lt;strong&gt;1 · 实际 SemCon 内容&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;以下字段与当前已得到的 surface_0 condition plan 一致，没有人为加入 exclude group。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;match_kind: code_element
code_element_type: function

k1 include
  keywords: [login]
  synonyms: [auth, authenticate, sign_in, log_in]
  reason: Core domain action for user authentication flow

k2 include
  keywords: [user]
  synonyms: [account, credential, identity, principal]
  reason: Primary entity being authenticated in the login context

group_logic
  groups: [k1, k2]
  graph_scope: call
  hop_count: 0&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;example-step planner&quot;&gt;
        &lt;strong&gt;2 · 实际 SurfaceConditionPlan&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Planner 保留 group 内 OR 和 group 间 AND_HOP；因为没有 exclude，condition result 是 identity。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;condition_id: surface_0
match:
  kind: code_element
  code_element_types: [function, method]
  code_text: null

include_clause:
  clause_id: surface_0_include
  property: include
  groups: [k1, k2]
  group_expression.operator: and_hop
  rule.groups: [k1, k2]
  rule.graph_scope: call
  rule.hop_count: 0
  rule.reason: Login action and user entity are typically
    co-located in the same function signature or body

exclude_clause: null
result_expression:
  operator: identity
  include_clause_id: surface_0_include
  exclude_clause_id: null&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;example-step planner&quot;&gt;
        &lt;strong&gt;3 · 构造的 Exclude 扩展&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;这一栏不是当前实际值，只用于说明未来同一 condition 出现 exclude group 时怎样规划。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;新增假设 group:
  k3 exclude
  terms = logout OR signout

则 Planner 额外生成:
  surface_0_exclude
    property: exclude
    groups: [k3]
    group_expression.operator: identity

result_expression:
  operator: subtract
  include_clause_id: surface_0_include
  exclude_clause_id: surface_0_exclude

语义 = AND_HOP(k1, k2) - OR(k3)&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;example-step executor&quot;&gt;
        &lt;strong&gt;4 · 构造的跨 Condition 扩展&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;这一栏同样是规划扩展示例：不同 match kind 由 Planner 做并集；当前 Surface Executor 只执行 code_element / unknown，snippet 留给后续专用 Executor。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;假设新增:
  surface_1 = code_element / function / entry OR handler
  surface_2 = code_snippet / validate token

function_group = INTERSECT(
  surface_0_result,
  surface_1_result
)

final_surface = UNION(
  function_group,
  surface_2_result
)&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;phase-divider&quot;&gt;后续 Optimizer：把 Logical Plan 转成低成本优先的 Physical Plan&lt;/div&gt;
    &lt;div class=&quot;cost-lane&quot; aria-label=&quot;计划优化器建议的执行成本顺序&quot;&gt;
      &lt;div class=&quot;cost-stage&quot;&gt;&lt;strong&gt;1 · 低成本召回&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;倒排、ngram、缩写扩展与代码元素类型；先快速建立候选集。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;cost-stage&quot;&gt;&lt;strong&gt;2 · 集合缩减&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;组内 OR、exclude subtract、同兼容键交集；优先执行高选择性条件。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;cost-stage&quot;&gt;&lt;strong&gt;3 · 图与语义过滤&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;AND(n)、显式 relation、Embedding 与聚类，只处理缩小后的候选。&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;cost-stage heavy&quot;&gt;&lt;strong&gt;4 · 高成本判别&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;LLM-as-a-Judge 放在末端，对少量候选做最终职责判断。&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;formula text-small&quot;&gt;
      Optimizer 当前是演进目标：后续可结合索引统计、候选基数、hop 范围、模型调用成本和历史选择率重排可交换算子；不可交换的 subtract、AND(n) 覆盖语义和显式依赖关系仍由 Logical Plan 约束。
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;surface-executor-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;surface-executor-heading&quot;&gt;Surface Executor：四层计划解释与集合执行&lt;/h2&gt;
      &lt;span class=&quot;viz-badge text-small&quot;&gt;直接消费 surface_semql · 不再解析旧 SemQL&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-plan-input&quot;&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;计划输入&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;SurfacePlan&lt;/strong&gt;：conditions、include / exclude clauses、group expressions 与 condition expression 已由 Planner 明确定义；Executor 只解释计划，不重新推断类型或合并逻辑。&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-layer-flow&quot; aria-label=&quot;Surface Executor 四层执行流程图&quot;&gt;
      &lt;div class=&quot;executor-layer term-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 1&lt;/span&gt;&lt;strong&gt;Term / Group Search&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;_execute_keyword_group(group, match_spec)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;执行单个 keyword group，输出 &lt;code&gt;SurfaceGroupResult&lt;/code&gt;。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Term OR&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;search_symbols_by_terms()&lt;/code&gt; 让 keyword OR synonym OR synonym … 复用倒排、ngram 与缩写扩展搜索。&lt;/span&gt;&lt;code&gt;R(k1)=login ∪ auth&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Condition type filter&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;filter_symbols_by_type()&lt;/code&gt; 按 &lt;code&gt;match_spec.code_element_types&lt;/code&gt; 过滤每组直接命中。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation persist&quot;&gt;&lt;strong&gt;保存 AND_HOP 前结果&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_record_group_search_result()&lt;/code&gt; 逐 condition / clause / group 保存 symbol 与 term evidence，供 case 分析。&lt;/span&gt;&lt;code&gt;surface_group_search_results.json&lt;/code&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer group-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 2&lt;/span&gt;&lt;strong&gt;Clause&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;_execute_clause(clause, match_spec)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;组合该 clause 下已经完成直接搜索的 group results。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;identity&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;唯一 group 结果原样返回。&lt;/span&gt;&lt;code&gt;R = R(k1)&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;or&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_union()&lt;/code&gt; 合并多个 group；exclude clause 由此形成全量负向集合。&lt;/span&gt;&lt;code&gt;R = ⋃ R(ki)&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;and_hop · n=0&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_and_hop() → _intersect()&lt;/code&gt;，无需访问代码图；完整覆盖当前 login / user plan。&lt;/span&gt;&lt;code&gt;R = ⋂ R(ki)&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;and_hop · n&amp;gt;0&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_execute_pair_rule()&lt;/code&gt; 优先从较小端点集做无向 hop 扩展，与另一组 direct 集合相交得到实际关系端点；多个 pair-rule 结果与未参与规则的普通 group 再做普通交集。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer condition-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 3&lt;/span&gt;&lt;strong&gt;Condition&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;_execute_condition(condition)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;严格执行 &lt;code&gt;result_expression.operator&lt;/code&gt;，合成 include / exclude clause。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;identity&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;返回 include_result。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;subtract&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;exclude groups 先分别执行组内 term OR，再由 &lt;code&gt;_union()&lt;/code&gt; 合并，最终通过 &lt;code&gt;_subtract()&lt;/code&gt; 从 include_result 减去。&lt;/span&gt;&lt;code&gt;I − UNION(Ei)&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;exclude_only&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;暂存全局负向集合，不作为正向候选返回。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;empty&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;返回空集合。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer cross-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 4&lt;/span&gt;&lt;strong&gt;Cross-condition&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;_execute_condition_expression(expression, condition_results)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;完全按 Planner 的兼容分组执行，不在 Executor 内重新推断 match kind 或代码元素类型。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;merge_group.identity&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;使用该兼容组的唯一 condition 结果。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;merge_group.intersect&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_intersect()&lt;/code&gt; 对同 match/type 兼容组内的 condition 结果取交集。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;expression.union&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_union()&lt;/code&gt; 合并不同兼容组结果。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;exclude-only subtraction&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;_subtract()&lt;/code&gt; 最后减去 &lt;code&gt;exclude_only_condition_ids&lt;/code&gt; 对应的负向结果集合。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-output&quot;&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;执行输出&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;Stable symbol list&lt;/strong&gt; + &lt;code&gt;surface_evidence.json&lt;/code&gt;：保留最终候选的 condition / group coverage、查询 term、matched_term、direct / graph_neighbor、pair rule 与 distance。&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-sequence text-small&quot; aria-label=&quot;第一阶段完整执行顺序&quot;&gt;
      &lt;span class=&quot;step&quot;&gt;group term OR&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;condition type filter&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;persist direct group results&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;include group AND(n)&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;condition exclude subtract&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;compatible condition intersection&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;incompatible condition union&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;exclude-only subtraction&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;stable symbol list&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-semantics&quot;&gt;
      &lt;div class=&quot;executor-note&quot;&gt;
        &lt;strong&gt;Call scope 的距离语义&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;第一阶段不区分 caller 与 callee。只要两个 group 的任意命中函数位于同一条调用链上，无论 A 调用 B 还是 B 调用 A，都按无向最短路径计算 hop_count；方向性约束仍交给 Relation Executor。&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-note&quot;&gt;
        &lt;strong&gt;Direct results 与最终 evidence&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;surface_group_search_results.json&lt;/code&gt; 保留 AND_HOP 前的逐组直接命中；最终 evidence 描述集合与图运算后的存活候选。code_snippet、code_line 与非空 code_text 当前返回明确 warning，并保留专用搜索 Executor 的 TODO。&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;details&gt;
      &lt;summary&gt;查看四层执行 Mermaid 定义&lt;/summary&gt;
      &lt;pre class=&quot;mermaid-source&quot;&gt;&lt;code&gt;flowchart TB
    PLAN[&quot;SurfacePlan&quot;] --&amp;gt; L1
    subgraph L1[&quot;Layer 1 · _execute_keyword_group(group, match_spec)&quot;]
      TERMS[&quot;keyword / synonyms&quot;] --&amp;gt; OR[&quot;term OR retrieval&quot;] --&amp;gt; TYPE[&quot;condition type filter&quot;] --&amp;gt; GR[&quot;SurfaceGroupResult&quot;]
      GR --&amp;gt; SNAPSHOT[&quot;persist direct group results&amp;lt;br/&amp;gt;before group expression&quot;]
    end
    GR --&amp;gt; L2
    subgraph L2[&quot;Layer 2 · _execute_clause(clause, match_spec)&quot;]
      ID[&quot;identity&quot;]
      U[&quot;or = UNION(groups)&quot;]
      AH0[&quot;and_hop(0) = INTERSECT(groups)&quot;]
      AHN[&quot;and_hop(n) = atomic pair rule&lt;br/&gt;endpoint expansion + direct-set intersection&quot;]
    end
    CALLGRAPH[&quot;Call graph&quot;] --&amp;gt; AHN
    L2 --&amp;gt; L3
    subgraph L3[&quot;Layer 3 · _execute_condition(condition)&quot;]
      CI[&quot;identity&quot;]
      CS[&quot;subtract: include − UNION(exclude groups)&quot;]
      CEO[&quot;exclude_only: retain global negative set&quot;]
      CE[&quot;empty&quot;]
    end
    L3 --&amp;gt; L4
    subgraph L4[&quot;Layer 4 · _execute_condition_expression(expression, results)&quot;]
      MI[&quot;compatible group: identity / INTERSECT&quot;] --&amp;gt; CU[&quot;incompatible groups: UNION&quot;] --&amp;gt; ES[&quot;subtract exclude-only sets&quot;]
    end
    L4 --&amp;gt; RESULT[&quot;Stable symbol list + coverage evidence&quot;]&lt;/code&gt;&lt;/pre&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;relation-executor-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;relation-executor-heading&quot;&gt;Relation Executor：结构约束的逐层交集&lt;/h2&gt;
      &lt;span class=&quot;viz-badge text-small&quot;&gt;直接消费 relation_semql · 复用 code graph 查询&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-plan-input&quot;&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;计划输入&lt;/span&gt;
      &lt;span&gt;&lt;strong&gt;RelationPlan&lt;/strong&gt;：Planner 已把每个 RelationCon 编译成 include / exclude clauses，并将 file_path、graph_role、caller、callee 与 code_ql 规范为独立字段。Executor 不再读取 caller / callee 的旧 hop_count，也不重新推断 clause 间关系。&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-layer-flow&quot; aria-label=&quot;Relation Executor 分层执行流程图&quot;&gt;
      &lt;div class=&quot;executor-layer term-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 1&lt;/span&gt;&lt;strong&gt;低成本路径约束&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;_filter_candidates_by_path(candidates, file_path)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;在任何图查询之前先缩小候选集。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;文件路径&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;输入包含文件名或扩展名时按文件路径 / 后缀匹配，允许仓库相对路径。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;目录路径&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;输入是目录或包路径时按规范化路径前缀匹配，该目录下代码元素均可保留。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer group-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 2&lt;/span&gt;&lt;strong&gt;图结构约束&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;_execute_clause(clause, candidates, graph_store)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;在同一 clause 内依次执行 graph_role、caller 与 callee，所有有效字段都是 AND。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;graph_role&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;通过 implementation-aware in/out degree 判断 entry_point、leaf 或 isolate；include 过滤会保留不适用调用图角色的非函数候选，exclude 过滤则不会把它们误当成角色命中。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;caller / callee&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;函数所在位置使用文件名而非完整路径；方向性调用关系直接查询代码关系数据库，不再携带 Surface 的无向 hop 语义。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;GraphStore lifecycle&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;调用方未传 store 时只初始化一次连接，随后统一走同一 store 过滤逻辑，避免维护两套数据库实现。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer condition-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Layer 3&lt;/span&gt;&lt;strong&gt;Clause / Plan 集合语义&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;code&gt;execute(plan, surface_candidates)&lt;/code&gt;
          &lt;span class=&quot;text-small&quot;&gt;严格执行 Planner 输出的集合运算。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Clause 内&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;file_path ∩ graph_role ∩ caller ∩ callee；每增加一个约束都在当前较小候选集上继续过滤。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Include clauses&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;多个 include condition 表示同时满足，逐 clause 与 Surface 候选取交集。&lt;/span&gt;&lt;code&gt;S ∩ I1 ∩ I2 …&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Exclude clauses&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;各负向 clause 独立求值后取并集，最后统一从 include 结果中减去。&lt;/span&gt;&lt;code&gt;R − (E1 ∪ E2 …)&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;code_ql&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;当前仅在计划与报告中保留未执行 warning，不会因尚未接入而误删候选。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-sequence text-small&quot; aria-label=&quot;Relation Executor 完整执行顺序&quot;&gt;
      &lt;span class=&quot;step&quot;&gt;Surface candidates&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;path pre-filter&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;graph role&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;caller / callee&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;include intersections&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;exclude union subtraction&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;filtered_by_relation&lt;/span&gt;
    &lt;/div&gt;
    &lt;details&gt;
      &lt;summary&gt;查看 Relation Executor Mermaid 定义&lt;/summary&gt;
      &lt;pre class=&quot;mermaid-source&quot;&gt;&lt;code&gt;flowchart LR
    S[&quot;Surface candidates&quot;] --&amp;gt; P[&quot;file / directory pre-filter&quot;]
    P --&amp;gt; G[&quot;graph_role filter&quot;] --&amp;gt; C[&quot;caller filter&quot;] --&amp;gt; E[&quot;callee filter&quot;]
    DB[&quot;Implementation-aware code graph&quot;] --&amp;gt; G
    DB --&amp;gt; C
    DB --&amp;gt; E
    E --&amp;gt; IC[&quot;INTERSECT all include clauses&quot;]
    S --&amp;gt; EX[&quot;evaluate exclude clauses&quot;] --&amp;gt; EU[&quot;UNION exclude results&quot;]
    IC --&amp;gt; SUB[&quot;include result − exclude union&quot;]
    EU --&amp;gt; SUB
    SUB --&amp;gt; R[&quot;Relation-filtered candidates&quot;]&lt;/code&gt;&lt;/pre&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;section class=&quot;section&quot; aria-labelledby=&quot;intention-executor-heading&quot;&gt;
    &lt;div class=&quot;section-head&quot;&gt;
      &lt;h2 id=&quot;intention-executor-heading&quot;&gt;Intention Executor：绝对边界、动态分布与灰区判别&lt;/h2&gt;
      &lt;span class=&quot;viz-badge text-small&quot;&gt;Planner-owned policy · Executor-only execution&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;raw-query-example&quot; aria-label=&quot;Intention Planner 示例的原始自然语言查询&quot;&gt;
      &lt;strong&gt;Raw Query&lt;/strong&gt;
      &lt;code&gt;raw_query: &quot;Find the production function that authenticates a user, excluding test or mock login handlers&quot;&lt;/code&gt;
    &lt;/div&gt;
    &lt;div class=&quot;planner-example-grid&quot;&gt;
      &lt;div class=&quot;example-step&quot;&gt;
        &lt;strong&gt;1 · IntentionCon requirements&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Planner 分开规范化正向职责与负向职责；action、object、keywords 的原始分组仍保存在 requirements 中。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;include:
  action: authenticate
  object: user
  keywords: [login, credential validation]

exclude:
  action: mock
  object: handler
  keywords: [test, fake]&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;example-step planner&quot;&gt;
        &lt;strong&gt;2 · Query profile 组装&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;每一侧按稳定顺序去重；Cluster 只使用正向 semantic_text，Embedding 同时消费正向与负向 terms。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;include_terms:
  [authenticate, user, login, credential validation]
exclude_terms:
  [mock, handler, test, fake]

semantic_text:
  raw_query + include_terms

result_logic:
  include_operator: all
  exclude_operator: any&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
      &lt;div class=&quot;example-step planner&quot;&gt;
        &lt;strong&gt;3 · Planner 为组件准备输入&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Planner 把语义数据和决策策略一次性写入 intention_semql，后续组件只消费属于自己的部分。&lt;/span&gt;
        &lt;pre class=&quot;example-code text-small&quot;&gt;&lt;code&gt;Cluster
  ← semantic_text

Project Term Embedding
  ← include_terms / exclude_terms
  → I / E / C / S

Absolute + Distribution rules
  ← thresholds / conflict policy / quantiles

LLM Judge
  ← gray candidates only
  → kept / discarded / uncertain&lt;/code&gt;&lt;/pre&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;executor-layer-flow&quot; aria-label=&quot;Intention Executor 混合决策流程图&quot;&gt;
      &lt;div class=&quot;executor-layer term-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;输入信号&lt;/span&gt;&lt;strong&gt;Cluster + Term Embedding&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;strong&gt;处理组件&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;Cluster 提供候选所在上下文的相关度，项目 Term Embedding 判断候选自身与正负意图的匹配程度。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;I · 正向相关度&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;候选对 include_terms 的语义覆盖分。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;E · 负向相关度&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;候选命中任一 exclude term 的最高分。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;C / S · 上下文与排序&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;C 是 Cluster 上下文分；S 综合 I、C、E，用于未决候选的查询内相对排序。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer condition-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;步骤 1&lt;/span&gt;&lt;strong&gt;绝对边界分流&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;strong&gt;处理组件：确定性规则&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;先处理跨查询含义稳定的明显正向与明显负向；只有无法确定的候选继续进入分布判断。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Exclude hard veto&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;E ≥ 0.60&lt;/code&gt;&lt;br&gt;→ &lt;code&gt;definite_discard&lt;/code&gt;&lt;br&gt;进入明确丢弃集合，不再调用 LLM。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation persist&quot;&gt;&lt;strong&gt;Absolute positive&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;I ≥ 0.55 ∧ E &amp;lt; 0.35 ∧ no conflict&lt;/code&gt;&lt;br&gt;→ &lt;code&gt;absolute_auto_keep&lt;/code&gt;&lt;br&gt;直接进入最终结果通道。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Absolute weak negative&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;I &amp;lt; 0.20&lt;/code&gt; 且无 Cluster 支持冲突&lt;br&gt;→ &lt;code&gt;absolute_discard&lt;/code&gt;&lt;br&gt;进入明确丢弃集合。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;其余情况&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;收集为 &lt;code&gt;unresolved&lt;/code&gt;，交给分布保护与自适应分流。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer cross-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;步骤 2&lt;/span&gt;&lt;strong&gt;Distribution guard&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;strong&gt;处理组件：分布保护器&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;先判断当前结果规模和分数跨度是否足以支持百分位切分，避免小样本或分数高度集中时产生武断结论。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;任一条件命中&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;candidate_count &amp;lt; 10&lt;/code&gt;&lt;br&gt;或 &lt;code&gt;unresolved_count &amp;lt; 8&lt;/code&gt;&lt;br&gt;或 &lt;code&gt;Q90(S)−Q10(S) &amp;lt; 0.10&lt;/code&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation persist&quot;&gt;&lt;strong&gt;保护结果&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;全部 unresolved → &lt;code&gt;gray_distribution_guard&lt;/code&gt; → 交给 LLM Judge。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;没有命中&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;说明样本量和分差足够，继续执行 Q40 / Q80 自适应分布。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer group-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;步骤 3&lt;/span&gt;&lt;strong&gt;Adaptive distribution&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;strong&gt;处理组件：查询内自适应分流&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;只处理通过 guard 的 unresolved 候选；相对排名必须同时满足绝对软边界，不能只凭百分位直接保留或丢弃。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation persist&quot;&gt;&lt;strong&gt;Top 20%&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;I ≥ 0.45 ∧ E &amp;lt; 0.25 ∧ no conflict&lt;/code&gt;&lt;br&gt;→ &lt;code&gt;adaptive_auto_keep&lt;/code&gt;，进入最终结果；否则 → &lt;code&gt;gray_high&lt;/code&gt;。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Middle 40%&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;→ &lt;code&gt;gray_middle&lt;/code&gt;；存在正负或上下文冲突时 → &lt;code&gt;gray_conflict&lt;/code&gt;。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Bottom 40%&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;I &amp;lt; 0.35 ∧ no conflict&lt;/code&gt;&lt;br&gt;→ &lt;code&gt;adaptive_discard&lt;/code&gt;；否则 → &lt;code&gt;gray_low / gray_conflict&lt;/code&gt;。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer term-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;步骤 4&lt;/span&gt;&lt;strong&gt;Gray-only LLM Judge&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;strong&gt;处理组件：LLM-as-a-Judge&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;只处理 gray_conflict、gray_high、gray_middle、gray_low 和 gray_distribution_guard；自动保留与自动丢弃结果不会重复判断。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation persist&quot;&gt;&lt;strong&gt;LLM kept&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;模型确认符合意图 → 进入最终结果。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;LLM discarded&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;模型确认不符合意图 → 丢弃。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;Uncertain / failure&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;按 &lt;code&gt;failure_policy&lt;/code&gt; 处理；当前 &lt;code&gt;keep_uncertain&lt;/code&gt; 会将其保留。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;executor-layer condition-layer&quot;&gt;
        &lt;div class=&quot;executor-layer-label&quot;&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;输出&lt;/span&gt;&lt;strong&gt;Final result&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;executor-method&quot;&gt;
          &lt;strong&gt;处理组件：结果合并器&lt;/strong&gt;
          &lt;span class=&quot;text-small&quot;&gt;合并所有被确定保留或策略保留的候选，并维持前序语义排序。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;executor-operations&quot;&gt;
          &lt;div class=&quot;executor-operation persist&quot;&gt;&lt;strong&gt;最终返回集合&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;absolute_auto_keep&lt;/code&gt;&lt;br&gt;∪ &lt;code&gt;adaptive_auto_keep&lt;/code&gt;&lt;br&gt;∪ &lt;code&gt;LLM kept&lt;/code&gt;&lt;br&gt;∪ 按 failure_policy 保留的 uncertain。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;executor-operation&quot;&gt;&lt;strong&gt;不会返回&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;definite_discard、absolute_discard、adaptive_discard 和 LLM discarded。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-sequence text-small&quot; aria-label=&quot;Intention Executor 决策顺序&quot;&gt;
      &lt;span class=&quot;step&quot;&gt;I / E / C / S&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;absolute decisions&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;collect unresolved&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;distribution guard&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;adaptive distribution&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;gray-only LLM&lt;/span&gt;&lt;span class=&quot;join&quot;&gt;→&lt;/span&gt;
      &lt;span class=&quot;step&quot;&gt;final result&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;executor-output&quot;&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;分析产物&lt;/span&gt;
      &lt;span&gt;&lt;code&gt;cluster_rescue_candidates.json&lt;/code&gt;、&lt;code&gt;embedding_gray_zone.json&lt;/code&gt;、各阶段 discarded 集合与 &lt;code&gt;intention_execution_report.json&lt;/code&gt; 共同记录每个候选经过 Cluster、绝对规则、动态分布和 LLM 后的完整去向。&lt;/span&gt;
    &lt;/div&gt;
    &lt;details&gt;
      &lt;summary&gt;查看 Intention Executor Mermaid 定义&lt;/summary&gt;
      &lt;pre class=&quot;mermaid-source&quot;&gt;&lt;code&gt;flowchart TB
    TERMS[&quot;include_terms / exclude_terms&quot;] --&amp;gt; SCORE[&quot;Cluster + Term Embedding&amp;lt;br/&amp;gt;produce I, E, C and S&quot;]
    SCORE --&amp;gt; VETO{&quot;E ≥ 0.60?&quot;}
    VETO --&amp;gt;|&quot;yes&quot;| DROP[&quot;definite_discard&quot;]
    VETO --&amp;gt;|&quot;no&quot;| POS{&quot;I ≥ 0.55 and E &amp;lt; 0.35&amp;lt;br/&amp;gt;and no conflict?&quot;}
    POS --&amp;gt;|&quot;yes&quot;| AKEEP[&quot;absolute_auto_keep&quot;]
    POS --&amp;gt;|&quot;no&quot;| NEG{&quot;I &amp;lt; 0.20 and no&amp;lt;br/&amp;gt;cluster-support conflict?&quot;}
    NEG --&amp;gt;|&quot;yes&quot;| ADROP[&quot;absolute_discard&quot;]
    NEG --&amp;gt;|&quot;no&quot;| UNRESOLVED[&quot;collect unresolved&quot;]

    UNRESOLVED --&amp;gt; GUARD{&quot;count / unresolved / spread&amp;lt;br/&amp;gt;guard triggered?&quot;}
    GUARD --&amp;gt;|&quot;yes&quot;| GRAY[&quot;all unresolved → gray&quot;]
    GUARD --&amp;gt;|&quot;no&quot;| DIST[&quot;adaptive Q40 / Q80 distribution&quot;]
    DIST --&amp;gt; DKEEP[&quot;adaptive_auto_keep&quot;]
    DIST --&amp;gt; DDROP[&quot;adaptive_discard&quot;]
    DIST --&amp;gt; GRAY

    GRAY --&amp;gt; LLM[&quot;Gray-only LLM Judge&quot;]
    LLM --&amp;gt; LKEEP[&quot;LLM kept&quot;]
    LLM --&amp;gt; LDROP[&quot;LLM discarded&quot;]
    LLM --&amp;gt; UNCERTAIN[&quot;uncertain → failure_policy&quot;]

    AKEEP --&amp;gt; FINAL[&quot;Final ranked result&quot;]
    DKEEP --&amp;gt; FINAL
    LKEEP --&amp;gt; FINAL
    UNCERTAIN --&amp;gt;|&quot;keep_uncertain&quot;| FINAL&lt;/code&gt;&lt;/pre&gt;
    &lt;/details&gt;

    &lt;details open&gt;
      &lt;summary&gt;Planner、Execution Plan 与后续优化器&lt;/summary&gt;
      &lt;div class=&quot;stage-panel&quot;&gt;
      &lt;div class=&quot;module-grid&quot;&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;QueryPlanner&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;在线查询的规划核心：编排三个领域 Planner，把 SemCon 编译为 Execution Plan Bundle，并隔离抽取 schema 与 Executor 契约。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;领域规划与计划文件已实现&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;SurfacePlanner&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;只解析 surfaceCon：group 内 terms 做 OR，原子 pair rule 按无向 hop 做 AND，exclude 做 subtract；兼容 condition 交集，不同兼容组并集。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;分层规划与 pair-rule 图执行已实现&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;RelationPlanner&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;只解析 relationCon，集中规范 caller、callee、role、file/container、CodeQL 与结构约束。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;已实现&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;IntentionPlanner&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;根据原始 query 与 intentionCon 构造 requirements、semantic_text、include / exclude terms，并声明 Cluster、绝对边界、动态分布、冲突和 LLM 的物理策略。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;语义与物理规划均已实现&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;领域计划文件&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;分别输出 &lt;code&gt;surface_semql.json&lt;/code&gt;、&lt;code&gt;relation_semql.json&lt;/code&gt;、&lt;code&gt;intention_semql.json&lt;/code&gt;，三者不复制其他领域条件。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;已生成并纳入测试&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;Executor 输入迁移&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;Surface、Relation 与 Intention Executor 已分别消费对应领域计划；字段解析、集合语义和物理策略由各自 Planner 提供。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;三类 Executor 已完成迁移&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;Cost-aware Optimizer&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;基于候选基数、过滤选择性、hop 范围和模型成本，将 Logical Plan 转成 Physical Plan；优先低成本高选择性算子，将 Embedding、聚类和 LLM Judge 后置。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot partial&quot;&gt;&lt;/span&gt;后续演进方向，尚未实现&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;details&gt;
      &lt;summary&gt;AND(n) 演进&lt;/summary&gt;
      &lt;div class=&quot;stage-panel&quot;&gt;
      &lt;div class=&quot;module-grid&quot;&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;keyword_groups&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;保留查询中的独立概念组；组内 keywords/synonyms 执行 OR，不再把全部词拍平。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;Schema 与 LLM Prompt 已支持&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;Graph-aware AND(n)&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;每条原子 pair rule 从较小端点集做无向调用距离扩展，与另一组 direct 结果匹配；规则间结果按计划继续做普通集合交集。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;已在 Surface Executor 落地&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;Atomic pair rule&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;每条规则只包含两个 include group、一个 graph_scope 和一个 hop_count；旧 groups/default_hop/pairwise 嵌套已移除。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;新版 Schema、Prompt、Planner 与 Executor 一致&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;NOT_HOP&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;删除直接命中排除概念或与其距离过近的候选，并使用比 include 更保守的传播范围。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot partial&quot;&gt;&lt;/span&gt;设计阶段&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;Coverage Evidence&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;同时保存 AND_HOP 前的逐组直接搜索快照，以及最终候选对应的 query term、matched term、pair rule、端点和距离。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot&quot;&gt;&lt;/span&gt;直接结果与最终 evidence 均已落盘&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;module&quot;&gt;
          &lt;div class=&quot;module-name&quot;&gt;距离衰减排序&lt;/div&gt;
          &lt;div class=&quot;module-copy&quot;&gt;&lt;span&gt;直接命中优先；图传播分数随 hop 距离衰减，再叠加覆盖率与邻近奖励。&lt;/span&gt;&lt;span class=&quot;status-line text-small&quot;&gt;&lt;span class=&quot;status-dot partial&quot;&gt;&lt;/span&gt;设计阶段&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;/div&gt;
    &lt;/details&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
