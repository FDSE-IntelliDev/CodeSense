}

  transform: translate(14px, -50%);
}

  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    &lt;div class=&quot;section-heading&quot;&gt;
      &lt;h2 id=&quot;q1-cases-heading&quot;&gt;Good cases：为什么被找到或被过滤&lt;/h2&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;从 evidence、图度数、Embedding 和 Judge 结果串联分析&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;case-grid&quot;&gt;
      &lt;article class=&quot;case keep&quot;&gt;
        &lt;div class=&quot;split-line&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;最终保留 · adaptive&lt;/span&gt;&lt;strong&gt;&lt;code&gt;#399 AuthController.login&lt;/code&gt;&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;case-route text-small&quot;&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Surface&lt;/strong&gt;&lt;span&gt;&lt;code&gt;login&lt;/code&gt; 直接命中 k1；k2 的 &lt;code&gt;user&lt;/code&gt; 由 3-hop 图邻居补齐。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Relation&lt;/strong&gt;&lt;span&gt;in-degree=0、out-degree=2，符合 entry_point。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Intention&lt;/strong&gt;&lt;span&gt;I=0.509、C=0.455、S=0.487；名称、Controller 容器和请求签名共同形成强正向证据。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;span&gt;&lt;code&gt;adaptive_positive&lt;/code&gt;，无需 LLM，直接进入最终结果。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;case keep&quot;&gt;
        &lt;div class=&quot;split-line&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;最终保留 · LLM&lt;/span&gt;&lt;strong&gt;&lt;code&gt;#154 SmsAuthenticationProvider.authenticate&lt;/code&gt;&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;case-route text-small&quot;&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Surface&lt;/strong&gt;&lt;span&gt;同义词 &lt;code&gt;auth&lt;/code&gt; 命中 &lt;code&gt;authenticate&lt;/code&gt;；&lt;code&gt;user&lt;/code&gt; 由距离 1 的图邻居补齐。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Relation&lt;/strong&gt;&lt;span&gt;in-degree=0、out-degree=5，符合 entry_point。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Intention&lt;/strong&gt;&lt;span&gt;I=0.449、C=0.389、S=0.425，位于 gray_middle，规则没有武断保留。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;span&gt;Judge 的 kept IDs 包含 #154；语义兜底保留了真正执行认证的 Provider。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;case filter&quot;&gt;
        &lt;div class=&quot;split-line&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Relation 过滤&lt;/span&gt;&lt;strong&gt;&lt;code&gt;#462 AuthServiceImpl.login&lt;/code&gt;&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;case-route text-small&quot;&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Surface&lt;/strong&gt;&lt;span&gt;&lt;code&gt;login&lt;/code&gt; 直接命中；&lt;code&gt;user&lt;/code&gt; 由距离 3 的图邻居补齐，因此成功进入 82 个召回结果。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Relation&lt;/strong&gt;&lt;span&gt;in-degree=1、out-degree=1，不是无入边的 entry_point。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;span&gt;在低成本图结构阶段被过滤；实现层函数没有进入 Cluster、Embedding 和 LLM。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;case filter&quot;&gt;
        &lt;div class=&quot;split-line&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;LLM 过滤 · helper&lt;/span&gt;&lt;strong&gt;&lt;code&gt;#1356 getAuthCredentialsByUsername&lt;/code&gt;&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;case-route text-small&quot;&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Surface&lt;/strong&gt;&lt;span&gt;&lt;code&gt;auth&lt;/code&gt; 直接命中；&lt;code&gt;user&lt;/code&gt; 由 3-hop 图邻居补齐。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Relation&lt;/strong&gt;&lt;span&gt;图度数为 (0,1)，因此结构上通过 entry_point 过滤。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Intention&lt;/strong&gt;&lt;span&gt;C=0.470 较高，但 I=0.414；进入 gray_high 而不是直接保留。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;span&gt;LLM 判断它只是凭据查询工具，不负责请求编排、凭据校验或会话建立，因此丢弃。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;case filter&quot;&gt;
        &lt;div class=&quot;split-line&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;LLM 过滤 · lexical confusion&lt;/span&gt;&lt;strong&gt;&lt;code&gt;#402 AuthController.logout&lt;/code&gt;&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;case-route text-small&quot;&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Surface&lt;/strong&gt;&lt;span&gt;查询 term &lt;code&gt;login&lt;/code&gt; 实际匹配到 &lt;code&gt;logout&lt;/code&gt;；另一概念由距离 2 的图邻居补齐，体现高召回阶段的宽松匹配。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Relation&lt;/strong&gt;&lt;span&gt;in-degree=0、out-degree=2，结构上仍是 entry_point，因此继续保留。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Intention&lt;/strong&gt;&lt;span&gt;I=0.397、S=0.386，进入 gray_middle。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;span&gt;LLM 明确识别“logout 不是 login”，完成最终语义纠错并丢弃。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;

      &lt;article class=&quot;case filter&quot;&gt;
        &lt;div class=&quot;split-line&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Rescue 后过滤&lt;/span&gt;&lt;strong&gt;&lt;code&gt;#817 getCurrentUserRoutes&lt;/code&gt;&lt;/strong&gt;&lt;/div&gt;
        &lt;div class=&quot;case-route text-small&quot;&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Surface&lt;/strong&gt;&lt;span&gt;&lt;code&gt;user&lt;/code&gt; 直接命中；&lt;code&gt;login&lt;/code&gt; 由 #399 在距离 2 处补齐。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Cluster&lt;/strong&gt;&lt;span&gt;C=0.243，属于 priority_4_low_relevance，但 rescue 策略使其继续进入 Embedding。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Intention&lt;/strong&gt;&lt;span&gt;I=0.425、S=0.352，进入 gray_low，没有被粗粒度 Cluster 直接误删。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;case-step&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;span&gt;LLM 判断它依赖已认证上下文、只是读取菜单路由，最终丢弃；rescue 保留了审查机会。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
