<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#F3F5F8"/>
<text x="80" y="50" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#223A48">SemCon: 三类原子语义条件</text>
<text x="80" y="78" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#697A84">按执行代价从低到高排列，对应 Surface -> Relation -> Intention 三级执行阶段</text>
<rect x="80" y="105" width="365" height="560" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="1" rx="8"/>
<rect x="80" y="105" width="365" height="8" fill="#2E7E94" rx="4"/>
<rect x="80" y="105" width="365" height="50" fill="#E8EDF2" rx="8"/>
<text x="262" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#223A48" text-anchor="middle">Surface Condition</text>
<text x="262" y="160" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#697A84" text-anchor="middle">表层 / 词法特征</text>
<text x="96" y="185" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E7E94">关键字段</text>
<text x="102" y="207" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">type: surface</text>
<text x="102" y="227" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">property: include | exclude</text>
<text x="102" y="247" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">keywords: ["login", ...]</text>
<text x="102" y="267" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">synonyms: ["sign in", ...]</text>
<text x="102" y="287" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">match_kind: code_element | code_line</text>
<text x="102" y="307" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">code_element_type: func | class</text>
<text x="96" y="335" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E7E94">执行后端</text>
<text x="96" y="357" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">exact search  inverted index</text>
<text x="96" y="377" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">ngram  abbreviation  fuzzy matcher</text>
<text x="96" y="397" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">term embedding (FastText + ICF)</text>
<rect x="465" y="105" width="365" height="560" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="1" rx="8"/>
<rect x="465" y="105" width="365" height="8" fill="#4A90A4" rx="4"/>
<rect x="465" y="105" width="365" height="50" fill="#E8EDF2" rx="8"/>
<text x="647" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#223A48" text-anchor="middle">Relation Condition</text>
<text x="647" y="160" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#697A84" text-anchor="middle">关系 / 结构特征</text>
<text x="481" y="185" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#4A90A4">关键字段</text>
<text x="487" y="207" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">type: relation</text>
<text x="487" y="227" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">code_element_type: func | class</text>
<text x="487" y="247" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">file_path / container</text>
<text x="487" y="267" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">graph_constraint: {anchor, rel, val}</text>
<text x="487" y="287" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">caller / callee</text>
<text x="487" y="307" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">code_ql: ... | null</text>
<text x="481" y="335" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#4A90A4">执行后端</text>
<text x="481" y="357" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">Tier 1: Symbol Index (&lt; 1ms)</text>
<text x="481" y="377" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">Tier 2: LSP Call Graph BFS/DFS</text>
<text x="481" y="397" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">Tier 3: CodeQL (秒级, 离线)</text>
<rect x="850" y="105" width="365" height="560" fill="#FFFFFF" stroke="#D0D8E0" stroke-width="1" rx="8"/>
<rect x="850" y="105" width="365" height="8" fill="#4CAF50" rx="4"/>
<rect x="850" y="105" width="365" height="50" fill="#E8EDF2" rx="8"/>
<text x="1032" y="138" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#223A48" text-anchor="middle">Intention Condition</text>
<text x="1032" y="160" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#697A84" text-anchor="middle">意图 / 语义特征</text>
<text x="866" y="185" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#4CAF50">关键字段</text>
<text x="872" y="207" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">type: intention</text>
<text x="872" y="227" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">intent: { action, object }</text>
<text x="872" y="247" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">intent_statement: "Yes/No"</text>
<text x="872" y="267" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">aspect: functional | non_f | domain</text>
<text x="872" y="287" font-family="Consolas, Courier New, monospace" font-size="11.5" fill="#485D6A">non_functional_type: perf | sec</text>
<text x="866" y="315" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700" fill="#4CAF50">执行后端</text>
<text x="866" y="337" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">Cluster Filter (粗粒度过滤)</text>
<text x="866" y="357" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">Embedding Filter (细粒度过滤)</text>
<text x="866" y="377" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11.5" fill="#485D6A">LLM-as-a-Judge (大模型验证)</text>
<text x="1230" y="705" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#697A84" text-anchor="end">9</text>
</svg>
