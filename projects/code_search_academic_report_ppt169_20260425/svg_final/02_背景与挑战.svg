<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7FAFC" />
  <rect x="0" y="0" width="1280" height="100" fill="#EAF1F8" />
  <text x="64" y="66" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1F3A">为什么传统代码检索难以满足 Agent Query</text>

  <path fill="#0B1F3A" d="M78,140 H380 A14,14 0 0 1 394,154 V616 A14,14 0 0 1 380,630 H78 A14,14 0 0 1 64,616 V154 A14,14 0 0 1 78,140 Z" />
  <text x="96" y="214" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#F7FAFC">问题定义</text>
  <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" fill="#EAF1F8" x="96" y="268">Agent Query 不仅有关键词，</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" fill="#EAF1F8" x="96" y="304">还包含隐式类型约束、</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="24" fill="#EAF1F8" x="96" y="340">语义关系与上下文偏好。</text><path fill="#FFFFFF" stroke="#CBD5E1" d="M444,140 H1202 A14,14 0 0 1 1216,154 V266 A14,14 0 0 1 1202,280 H444 A14,14 0 0 1 430,266 V154 A14,14 0 0 1 444,140 Z" />
  <text x="460" y="200" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">挑战 1：语义复杂，关键词直搜召回不足</text>
  <text x="460" y="236" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#334155">自然语言表达的目标对象、模块范围、关系条件难以一次命中</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M444,315 H1202 A14,14 0 0 1 1216,329 V441 A14,14 0 0 1 1202,455 H444 A14,14 0 0 1 430,441 V329 A14,14 0 0 1 444,315 Z" />
  <text x="460" y="375" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">挑战 2：候选噪声高，精度与可解释性不足</text>
  <text x="460" y="411" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#334155">缺少结构化过滤与语义验证会引入大量“看似相关”结果</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M444,490 H1202 A14,14 0 0 1 1216,504 V616 A14,14 0 0 1 1202,630 H444 A14,14 0 0 1 430,616 V504 A14,14 0 0 1 444,490 Z" />
  <text x="460" y="550" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">挑战 3：仅看单点相关，忽略调用链组关系</text>
  <text x="460" y="586" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#334155">单元素得分高不等于任务相关高，关系上下文必须纳入排序</text>

  <text x="64" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#64748B">02</text>
</svg>