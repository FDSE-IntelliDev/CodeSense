<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7FAFC" />
  <rect x="0" y="0" width="1280" height="100" fill="#EAF1F8" />
  <text x="64" y="66" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1F3A">Step3: Rule + Semantic Filtering</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M76,140 H592 A12,12 0 0 1 604,152 V628 A12,12 0 0 1 592,640 H76 A12,12 0 0 1 64,628 V152 A12,12 0 0 1 76,140 Z" />
  <text x="94" y="196" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">Rule-based Filtering</text>
  <text x="94" y="248" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">依据 DSL 约束做硬规则筛选：</text>
  <text x="94" y="290" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#0F172A">target = function</text>
  <text x="94" y="324" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">=&gt; 删除 class / file-level 无关元素</text>
  <text x="94" y="372" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">filters = disk + performance</text>
  <text x="94" y="406" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">=&gt; 优先保留满足模块与语义约束候选</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M688,140 H1204 A12,12 0 0 1 1216,152 V628 A12,12 0 0 1 1204,640 H688 A12,12 0 0 1 676,628 V152 A12,12 0 0 1 688,140 Z" />
  <text x="706" y="196" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">Semantic Filtering</text>
  <text x="706" y="248" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">由大模型抽取候选代码语义，判定：</text>
  <text x="706" y="288" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">• 是否与 filter 概念一致</text>
  <text x="706" y="322" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">• 是否满足 query 目标语义</text>
  <text x="706" y="356" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">• 是否仅表面词相似但语义偏离</text>

  <polygon points="600,350 640,350 640,336 666,370 640,404 640,390 600,390" fill="#12B5CB" />

  <path fill="#12B5CB" fill-opacity="0.12" stroke="#12B5CB" d="M74,590 H1206 A10,10 0 0 1 1216,600 V630 A10,10 0 0 1 1206,640 H74 A10,10 0 0 1 64,630 V600 A10,10 0 0 1 74,590 Z" />
  <text x="640" y="623" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="26" font-weight="700" fill="#0B1F3A">候选集从“高召回”进一步收敛为“高质量”</text>

  <text x="64" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#64748B">06</text>
</svg>