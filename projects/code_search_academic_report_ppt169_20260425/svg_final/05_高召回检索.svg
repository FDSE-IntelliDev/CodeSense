  <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155" x="94" y="278">• 快速覆盖显式关键词</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155" x="94" y="312">• 支持模式匹配与别名</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155" x="94" y="346">• 高速首轮召回</text><path fill="#FFFFFF" stroke="#CBD5E1" d="M472,150 H808 A14,14 0 0 1 822,164 V556 A14,14 0 0 1 808,570 H472 A14,14 0 0 1 458,556 V164 A14,14 0 0 1 472,150 Z" />
