  <text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155" x="488" y="278">• 面向大规模符号库</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155" x="488" y="312">• 支持词项级高速定位</text><text font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155" x="488" y="346">• 提升检索吞吐</text><path fill="#FFFFFF" stroke="#CBD5E1" d="M866,150 H1202 A14,14 0 0 1 1216,164 V556 A14,14 0 0 1 1202,570 H866 A14,14 0 0 1 852,556 V164 A14,14 0 0 1 866,150 Z" />
