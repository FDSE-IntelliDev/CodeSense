  <rect width="1280" height="720" fill="#F7FAFC" />
  <rect x="0" y="0" width="1280" height="100" fill="#EAF1F8" />
  <text x="64" y="66" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1F3A">Step4.1: Single Reranking</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M76,140 H612 A12,12 0 0 1 624,152 V348 A12,12 0 0 1 612,360 H76 A12,12 0 0 1 64,348 V152 A12,12 0 0 1 76,140 Z" />
  <text x="94" y="196" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">1) LLM Relevance Scoring</text>
  <text x="94" y="242" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">逐元素判断候选与 query 语义相关性</text>
  <text x="94" y="280" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#0F172A">score_llm(code_i, query)</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M668,140 H1204 A12,12 0 0 1 1216,152 V348 A12,12 0 0 1 1204,360 H668 A12,12 0 0 1 656,348 V152 A12,12 0 0 1 668,140 Z" />
  <text x="686" y="196" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">2) Token Overlap Scoring</text>
  <text x="686" y="242" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">query=netlink, code=net_link_unbounded</text>
  <text x="686" y="280" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">覆盖 net + link，缩写/全称匹配可加分</text>

  <path fill="#FFFFFF" stroke="#CBD5E1" d="M76,390 H1204 A12,12 0 0 1 1216,402 V598 A12,12 0 0 1 1204,610 H76 A12,12 0 0 1 64,598 V402 A12,12 0 0 1 76,390 Z" />
  <text x="94" y="446" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F6FEB">3) Code Weight Scoring</text>
  <text x="94" y="492" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">• 根据元素类型赋权：函数可高于类与变量</text>
  <text x="94" y="526" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">• 根据调用链距离赋权：越接近核心语义节点得分越高</text>
  <text x="94" y="560" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" fill="#334155">• 与 query 目标一致性高的元素优先进入 Top-K</text>

  <text x="64" y="690" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#64748B">07</text>
