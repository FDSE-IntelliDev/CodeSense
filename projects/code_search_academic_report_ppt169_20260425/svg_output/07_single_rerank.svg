<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7FAFC"/>
  <rect x="0" y="0" width="1280" height="100" fill="#EAF1F8"/>
  <text x="64" y="66" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="40" font-weight="700" fill="#0B1F3A">Step4.1: Single Reranking</text>

  <rect x="64" y="140" width="560" height="220" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="94" y="196" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="700" fill="#1F6FEB">1) LLM Relevance Scoring</text>
  <text x="94" y="242" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">逐元素判断候选与 query 语义相关性</text>
  <text x="94" y="280" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#0F172A">score_llm(code_i, query)</text>

  <rect x="656" y="140" width="560" height="220" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="686" y="196" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="700" fill="#1F6FEB">2) Token Overlap Scoring</text>
  <text x="686" y="242" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">query=netlink, code=net_link_unbounded</text>
  <text x="686" y="280" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">覆盖 net + link，缩写/全称匹配可加分</text>

  <rect x="64" y="390" width="1152" height="220" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="94" y="446" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="700" fill="#1F6FEB">3) Code Weight Scoring</text>
  <text x="94" y="492" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">• 根据元素类型赋权：函数可高于类与变量</text>
  <text x="94" y="526" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">• 根据调用链距离赋权：越接近核心语义节点得分越高</text>
  <text x="94" y="560" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">• 与 query 目标一致性高的元素优先进入 Top-K</text>

  <text x="64" y="690" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">07</text>
</svg>
