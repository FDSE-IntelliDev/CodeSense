  <rect x="64" y="600" width="1152" height="70" rx="10" fill="#12B5CB" fill-opacity="0.12" stroke="#12B5CB"/>
  <text x="640" y="644" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="700" fill="#0B1F3A">三路互补合并，形成高 Recall 候选池</text>

  <text x="64" y="690" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">05</text>
