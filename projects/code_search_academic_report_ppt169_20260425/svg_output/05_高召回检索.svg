  <rect x="852" y="150" width="364" height="420" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="852" y="150" width="364" height="72" rx="14" fill="#12B5CB"/>
  <text x="1034" y="196" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="700" fill="#F7FAFC">Embedding 语义检索</text>
  <text x="882" y="278" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">
