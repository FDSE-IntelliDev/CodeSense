  <rect x="458" y="150" width="364" height="420" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="458" y="150" width="364" height="72" rx="14" fill="#1F6FEB"/>
  <text x="640" y="196" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="700" fill="#F7FAFC">倒排索引检索</text>
  <text x="488" y="278" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">
