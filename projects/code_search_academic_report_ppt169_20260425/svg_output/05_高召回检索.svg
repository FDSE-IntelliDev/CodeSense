  <text x="64" y="66" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="40" font-weight="700" fill="#0B1F3A">Step2: High-Recall Candidate Retrieval</text>

  <rect x="64" y="150" width="364" height="420" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="64" y="150" width="364" height="72" rx="14" fill="#0B1F3A"/>
  <text x="246" y="196" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="28" font-weight="700" fill="#F7FAFC">grep 正则检索</text>
  <text x="94" y="278" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" fill="#334155">
    <tspan x="94" dy="0">• 快速覆盖显式关键词</tspan>
    <tspan x="94" dy="34">• 支持模式匹配与别名</tspan>
    <tspan x="94" dy="34">• 高速首轮召回</tspan>
