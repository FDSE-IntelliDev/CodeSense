  <text x="420" y="157" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="30" font-weight="700" fill="#FFFFFF">SemQL / Query DSL</text>
  <text x="764" y="156" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#EAF1F8">query_dsl_new.json</text>

  <text x="420" y="209" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="700" fill="#0F172A">intent.action/object</text>
  <text x="626" y="209" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#334155">理解用户要找什么</text>
  <text x="420" y="241" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="700" fill="#1F6FEB">keywords[]</text>
  <text x="626" y="241" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#334155">主检索词与同义词扩展</text>
  <text x="420" y="273" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="700" fill="#12B5CB">filters[] / exclude[]</text>
  <text x="626" y="273" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#334155">保留/排除条件</text>
  <text x="420" y="305" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="700" fill="#0B1F3A">target / raw_query</text>
  <text x="626" y="305" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#334155">代码元素类型与原始语义</text>

