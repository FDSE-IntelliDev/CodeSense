  <text x="972" y="164" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="700" fill="#0F172A">多路召回检索</text>
  <text x="972" y="197" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#1F6FEB">keywords, intent, target</text>
  <text x="972" y="224" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">grep / index / embedding 共同扩展召回</text>

  <line x1="602" y1="328" x2="602" y2="376" stroke="#1F6FEB" stroke-width="4"/>
  <polygon points="602,398 585,376 619,376" fill="#1F6FEB"/>

  <rect x="96" y="392" width="1088" height="70" rx="12" fill="#12B5CB" fill-opacity="0.12" stroke="#12B5CB"/>
