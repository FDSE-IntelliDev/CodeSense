  <rect x="90" y="504" width="260" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="90" y="504" width="260" height="34" rx="10" fill="#EAF1F8"/>
  <text x="116" y="529" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#0B1F3A">Filtering</text>
  <text x="116" y="565" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#12B5CB">filters[] + exclude[]</text>
  <text x="116" y="592" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">按概念关系保留相关代码，剔除噪声</text>

  <rect x="386" y="504" width="260" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="386" y="504" width="260" height="34" rx="10" fill="#EAF1F8"/>
  <text x="412" y="529" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#0B1F3A">Single Rerank</text>
  <text x="412" y="565" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#1F6FEB">raw_query + intent</text>
  <text x="412" y="592" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">评估候选与原始需求、动作对象的一致性</text>

  <rect x="682" y="504" width="260" height="116" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="682" y="504" width="260" height="34" rx="10" fill="#EAF1F8"/>
  <text x="708" y="529" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#0B1F3A">Group Rerank</text>
  <text x="708" y="565" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#0B1F3A">target + filters</text>
  <text x="708" y="592" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">从代码元素类型和约束出发组织结果组</text>

