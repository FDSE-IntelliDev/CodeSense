<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7FAFC"/>
  <rect x="0" y="0" width="1280" height="100" fill="#EAF1F8"/>
  <text x="64" y="58" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="40" font-weight="700" fill="#0B1F3A">SemQL as Pipeline Contract</text>
  <text x="64" y="86" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#64748B">把自然语言整理成结构化、高信息量 schema；后续检索、过滤、重排按字段消费同一份 QL</text>

  <rect x="64" y="136" width="196" height="110" rx="12" fill="#0B1F3A"/>
  <text x="162" y="178" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="24" font-weight="700" fill="#FFFFFF">自然语言 Query</text>
  <text x="162" y="213" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#EAF1F8">functions that add</text>
  <text x="162" y="236" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" fill="#EAF1F8">user accounts</text>

  <polygon points="286,183 336,183 336,170 366,200 336,230 336,217 286,217" fill="#1F6FEB"/>

  <rect x="392" y="122" width="420" height="206" rx="12" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="3"/>
