<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="gc1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="gc2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12B5CB"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="gc3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7FAFC"/>

  <!-- Page title -->
  <text x="64" y="68" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1F3A">
    <tspan>SemCon：三类原子语义条件</tspan>
  </text>
  <text x="64" y="100" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#64748B">
    <tspan>按执行代价从低到高排列，对应 Surface → Relation → Intention 三级执行阶段</tspan>
  </text>

  <!-- Card 1: Surface -->
  <rect x="64" y="130" width="368" height="510" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="64" y="130" width="368" height="8" rx="4" fill="url(#gc1)"/>
  <rect x="64" y="130" width="368" height="60" rx="12" fill="#EAF1F8"/>
  <text x="248" y="168" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="middle">
    <tspan>Surface Condition</tspan>
  </text>
  <text x="248" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">
    <tspan>表层 / 词法特征 | 低成本优先召回</tspan>
  </text>

  <text x="88" y="266" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F6FEB">
    <tspan>关键字段</tspan>
  </text>
  <text x="88" y="300" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#0F172A">
    <tspan>type: "surface"</tspan>
    <tspan x="88" y="326" fill="#334155">property: include | exclude</tspan>
    <tspan x="88" y="352" fill="#334155">keywords: [...]</tspan>
    <tspan x="88" y="378" fill="#334155">synonyms: [...]</tspan>
    <tspan x="88" y="404" fill="#334155">match_kind: code_element |</tspan>
    <tspan x="112" y="430" fill="#334155">code_snippet | code_line</tspan>
    <tspan x="88" y="456" fill="#334155">code_element_type: function |</tspan>
    <tspan x="112" y="482" fill="#334155">class | variable | ...</tspan>
  </text>

  <text x="88" y="530" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F6FEB">
    <tspan>执行后端</tspan>
  </text>
  <text x="88" y="560" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#334155">
    <tspan>exact search · inverted index</tspan>
    <tspan x="88" y="586" fill="#334155">ngram · abbreviation · fuzzy matcher</tspan>
    <tspan x="88" y="612" fill="#334155">term embedding (FastText + ICF)</tspan>
  </text>

  <!-- Card 2: Relation -->
  <rect x="456" y="130" width="368" height="510" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="456" y="130" width="368" height="8" rx="4" fill="url(#gc2)"/>
  <rect x="456" y="130" width="368" height="60" rx="12" fill="#EAF1F8"/>
  <text x="640" y="168" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="middle">
    <tspan>Relation Condition</tspan>
  </text>
  <text x="640" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">
    <tspan>关系 / 结构特征 | 中等成本约束收敛</tspan>
  </text>

  <text x="480" y="266" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#12B5CB">
    <tspan>关键字段</tspan>
  </text>
  <text x="480" y="300" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#0F172A">
    <tspan>type: "relation"</tspan>
    <tspan x="480" y="326" fill="#334155">property: include | exclude</tspan>
    <tspan x="480" y="352" fill="#334155">code_element_type: function |</tspan>
    <tspan x="496" y="378" fill="#334155">class | variable | ...</tspan>
    <tspan x="480" y="404" fill="#334155">file_path: "path/*.py"</tspan>
    <tspan x="480" y="430" fill="#334155">container: "ClassA"</tspan>
    <tspan x="480" y="456" fill="#334155">graph_constraint: {</tspan>
    <tspan x="496" y="482" fill="#334155">anchor, relation, value }</tspan>
    <tspan x="480" y="508" fill="#334155">caller / callee: ...</tspan>
    <tspan x="480" y="534" fill="#334155">code_ql: "..." | null</tspan>
  </text>

  <text x="480" y="580" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#12B5CB">
    <tspan>执行后端</tspan>
  </text>
  <text x="480" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#334155">
    <tspan>Tier 1: Symbol Index (&lt; 1ms)</tspan>
    <tspan x="480" y="630" fill="#334155">Tier 2: LSP Call Graph BFS/DFS</tspan>
  </text>

  <!-- Card 3: Intention -->
  <rect x="848" y="130" width="368" height="510" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="848" y="130" width="368" height="8" rx="4" fill="url(#gc3)"/>
  <rect x="848" y="130" width="368" height="60" rx="12" fill="#EAF1F8"/>
  <text x="1032" y="168" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="middle">
    <tspan>Intention Condition</tspan>
  </text>
  <text x="1032" y="216" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">
    <tspan>意图 / 语义特征 | 高成本后置判别</tspan>
  </text>

  <text x="872" y="266" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#16A34A">
    <tspan>关键字段</tspan>
  </text>
  <text x="872" y="300" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#0F172A">
    <tspan>type: "intention"</tspan>
    <tspan x="872" y="326" fill="#334155">property: include | exclude</tspan>
    <tspan x="872" y="352" fill="#334155">intent: {</tspan>
    <tspan x="888" y="378" fill="#334155">action: "...",</tspan>
    <tspan x="888" y="404" fill="#334155">object: "..." }</tspan>
    <tspan x="872" y="430" fill="#334155">intent_statement: "..."</tspan>
    <tspan x="872" y="456" fill="#334155">aspect: functional |</tspan>
    <tspan x="888" y="482" fill="#334155">non_functional | domain</tspan>
    <tspan x="872" y="508" fill="#334155">non_functional_type: performance</tspan>
    <tspan x="888" y="534" fill="#334155">| security | ... | null</tspan>
  </text>

  <text x="872" y="580" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#16A34A">
    <tspan>执行后端</tspan>
  </text>
  <text x="872" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#334155">
    <tspan>Cluster Filter (粗粒度)</tspan>
    <tspan x="872" y="630" fill="#334155">Embedding Filter (细粒度)</tspan>
  </text>

  <text x="1216" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#CBD5E1" text-anchor="end">09</text>
</svg>