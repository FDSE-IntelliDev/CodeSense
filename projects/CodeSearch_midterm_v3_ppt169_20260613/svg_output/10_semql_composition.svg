<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="gc1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F7FAFC"/>

  <!-- Page title -->
  <text x="64" y="56" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="40" font-weight="700" fill="#0B1F3A">
    <tspan>SemQL：从原子条件到逻辑组合查询计划</tspan>
  </text>

  <!-- Left: SemCon Extraction -->
  <rect x="64" y="80" width="548" height="590" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="64" y="80" width="548" height="48" rx="12" fill="#0B1F3A"/>
  <text x="338" y="112" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <tspan>Step 1: SemCon 抽取（LLM 驱动）</tspan>
  </text>

  <!-- Query box -->
  <rect x="88" y="148" width="500" height="52" rx="8" fill="#EAF1F8"/>
  <text x="104" y="160" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#64748B">
    <tspan>Query</tspan>
  </text>
  <text x="104" y="186" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#0F172A">
    <tspan>"Find the login function but not logout"</tspan>
  </text>

  <!-- Surface card -->
  <rect x="88" y="220" width="500" height="130" rx="8" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="2"/>
  <rect x="88" y="220" width="500" height="36" rx="8" fill="#1F6FEB"/>
  <text x="104" y="245" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
    <tspan>c1: Surface Condition (include)</tspan>
  </text>
  <text x="104" y="278" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>"type": "surface",</tspan>
  </text>
  <text x="104" y="298" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>"keywords": ["login"], "match_kind": "code_element"</tspan>
  </text>
  <text x="104" y="322" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#64748B">
    <tspan>→ 匹配 login 函数名</tspan>
  </text>

  <!-- Relation card -->
  <rect x="88" y="365" width="500" height="130" rx="8" fill="#FFFFFF" stroke="#12B5CB" stroke-width="2"/>
  <rect x="88" y="365" width="500" height="36" rx="8" fill="#12B5CB"/>
  <text x="104" y="390" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
    <tspan>c2: Relation Condition (include)</tspan>
  </text>
  <text x="104" y="423" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>"type": "relation",</tspan>
  </text>
  <text x="104" y="443" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>"code_element_type": "function"</tspan>
  </text>
  <text x="104" y="467" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#64748B">
    <tspan>→ 限定目标为函数类型</tspan>
  </text>

  <!-- Intention/exclude card -->
  <rect x="88" y="510" width="500" height="130" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <rect x="88" y="510" width="500" height="36" rx="8" fill="#DC2626"/>
  <text x="104" y="535" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
    <tspan>c3: Intention Condition (exclude)</tspan>
  </text>
  <text x="104" y="568" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>"type": "intention", "property": "exclude",</tspan>
  </text>
  <text x="104" y="588" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>"keywords": ["logout"]</tspan>
  </text>
  <text x="104" y="612" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" fill="#64748B">
    <tspan>→ 排除 logout 相关代码</tspan>
  </text>

  <!-- Right: SemQL Composition -->
  <rect x="636" y="80" width="580" height="590" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="636" y="80" width="580" height="48" rx="12" fill="url(#gc1)"/>
  <text x="926" y="112" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <tspan>Step 2: SemQL 逻辑组合 (Agent/人工)</tspan>
  </text>

  <!-- Logic expression -->
  <rect x="660" y="150" width="532" height="76" rx="8" fill="#0B1F3A"/>
  <text x="926" y="172" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="14" fill="#12B5CB" text-anchor="middle">
    <tspan>Logic: (c1 AND c2) AND NOT c3</tspan>
  </text>
  <text x="926" y="210" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">
    <tspan>匹配 login 函数，排除 logout</tspan>
  </text>

  <!-- AND tree visualization -->
  <text x="726" y="270" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A">
    <tspan>逻辑树结构</tspan>
  </text>

  <!-- AND node -->
  <rect x="866" y="288" width="60" height="36" rx="18" fill="#1F6FEB"/>
  <text x="896" y="313" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">AND</text>

  <!-- Lines from AND to children -->
  <line x1="880" y1="324" x2="830" y2="360" stroke="#1F6FEB" stroke-width="2"/>
  <line x1="896" y1="324" x2="896" y2="360" stroke="#1F6FEB" stroke-width="2"/>
  <line x1="930" y1="324" x2="980" y2="360" stroke="#1F6FEB" stroke-width="2"/>

  <!-- c1 -->
  <rect x="776" y="365" width="108" height="36" rx="8" fill="#1F6FEB"/>
  <text x="830" y="389" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">c1: include</text>

  <!-- c2 -->
  <rect x="842" y="365" width="108" height="36" rx="8" fill="#12B5CB"/>
  <text x="896" y="389" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">c2: include</text>

  <!-- NOT node -->
  <rect x="950" y="365" width="60" height="36" rx="18" fill="#DC2626"/>
  <text x="980" y="389" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">NOT</text>

  <!-- Line from NOT to c3 -->
  <line x1="980" y1="401" x2="980" y2="436" stroke="#DC2626" stroke-width="2"/>

  <rect x="926" y="441" width="108" height="36" rx="8" fill="#DC2626"/>
  <text x="980" y="465" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">c3: exclude</text>

  <!-- SemQL JSON section -->
  <text x="660" y="528" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1F3A">
    <tspan>输出结构</tspan>
  </text>

  <rect x="660" y="544" width="532" height="116" rx="8" fill="#EAF1F8"/>
  <text x="678" y="568" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#0F172A">
    <tspan>semCon.json (LLM 抽取) → semQL.json (按 include/exclude 组织)</tspan>
    <tspan x="678" y="594" fill="#334155">输出至 output/{project}/semCon.json, output/{project}/semQL.json</tspan>
    <tspan x="678" y="620" fill="#334155">后续由优化器 (RBO/CBO) 动态规划执行顺序</tspan>
    <tspan x="678" y="646" fill="#64748B">实现: query_processing/llm_semCon_extractor.py + semQL_composer.py</tspan>
  </text>

  <text x="1216" y="700" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#CBD5E1" text-anchor="end">10</text>
</svg>