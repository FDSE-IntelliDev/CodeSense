  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M666,224 H1210 A6,6 0 0 1 1216,230 V256 A6,6 0 0 1 1210,262 H666 A6,6 0 0 1 660,256 V230 A6,6 0 0 1 666,224 Z" />
  <text x="684" y="249" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#16A34A">
