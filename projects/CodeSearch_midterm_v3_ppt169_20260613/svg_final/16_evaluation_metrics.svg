  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M70,270 H626 A6,6 0 0 1 632,276 V302 A6,6 0 0 1 626,308 H70 A6,6 0 0 1 64,302 V276 A6,6 0 0 1 70,270 Z" />
  <text x="88" y="295" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F6FEB">
