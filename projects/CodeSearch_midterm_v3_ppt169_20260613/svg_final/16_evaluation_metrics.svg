  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M666,178 H1210 A6,6 0 0 1 1216,184 V210 A6,6 0 0 1 1210,216 H666 A6,6 0 0 1 660,210 V184 A6,6 0 0 1 666,178 Z" />
  <text x="684" y="203" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#16A34A">
