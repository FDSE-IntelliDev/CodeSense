  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M70,362 H626 A6,6 0 0 1 632,368 V394 A6,6 0 0 1 626,400 H70 A6,6 0 0 1 64,394 V368 A6,6 0 0 1 70,362 Z" />
  <text x="88" y="387" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#12B5CB">
