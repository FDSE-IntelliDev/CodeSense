  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M666,270 H1210 A6,6 0 0 1 1216,276 V316 A6,6 0 0 1 1210,322 H666 A6,6 0 0 1 660,316 V276 A6,6 0 0 1 666,270 Z" />
  <text x="684" y="292" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#16A34A">
