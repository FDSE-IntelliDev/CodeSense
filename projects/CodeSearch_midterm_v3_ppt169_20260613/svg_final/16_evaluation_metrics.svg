  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M70,178 H626 A6,6 0 0 1 632,184 V210 A6,6 0 0 1 626,216 H70 A6,6 0 0 1 64,210 V184 A6,6 0 0 1 70,178 Z" />
  <text x="88" y="203" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F6FEB">
