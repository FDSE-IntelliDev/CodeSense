  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M70,316 H626 A6,6 0 0 1 632,322 V348 A6,6 0 0 1 626,354 H70 A6,6 0 0 1 64,348 V322 A6,6 0 0 1 70,316 Z" />
