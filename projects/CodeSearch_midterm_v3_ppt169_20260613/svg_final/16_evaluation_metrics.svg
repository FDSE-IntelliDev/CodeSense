  </text>

  <path fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" d="M666,118 H1210 A6,6 0 0 1 1216,124 V164 A6,6 0 0 1 1210,170 H666 A6,6 0 0 1 660,164 V124 A6,6 0 0 1 666,118 Z" />
  <text x="684" y="140" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" font-weight="700" fill="#16A34A">
